# Inicializado por supabase init (CLI 2.116.0), reduzido ao escopo local F1-01.
# Referência: https://supabase.com/docs/guides/local-development/cli/config
project_id = "feedback-control"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Seed sintético de desenvolvimento (F1-05), reaplicado a cada db reset/rebuild.
# Sem dados funcionais: o schema técnico ainda não possui tabelas de domínio.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Auth local habilitado a partir da F2-01 (Issue #68): fornece o schema auth e
# a tabela auth.users, fonte de identidade para o perfil interno (user_profiles)
# e para RLS. O auto-cadastro público permanece desabilitado (F2-03/F2-05).
# NOTA (F2-05): NÃO usar [auth.email].enable_signup = false — isso desliga o
# provedor de e-mail por completo (login e recuperação de senha). Para manter
# login/recuperação por e-mail, apenas o enable_signup global é false.
[auth]
enabled = true
enable_signup = false
# Origem do app em desenvolvimento local (Vite) para os links de recuperação de
# senha (F2-05). O redirectTo do fluxo usa window.location.origin da aplicação.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]

[realtime]
enabled = false

[storage]
enabled = false

# Captura local de e-mails de desenvolvimento (mailpit/inbucket), necessária
# para validar o fluxo real de recuperação de senha (F2-05). Apenas local.
[local_smtp]
enabled = true

# Edge Functions habilitadas na F2-06 (Issue #73): fronteira server-side para
# o convite administrativo (Auth Admin, chave de serviço). Valores locais abaixo
# são apenas de desenvolvimento; em produção use o dashboard (hosted secrets).
[edge_runtime]
enabled = true

[edge_runtime.secrets]
# Allowlist local de administradores autorizados a convidar (UUIDs separados
# por vírgula). Não é credencial; é identificador. Fail-closed na função.
INVITE_ADMIN_USER_IDS = "b0000000-0000-0000-0000-000000000001"

[analytics]
enabled = false

[functions.convidar-usuario]
enabled = true
verify_jwt = false
entrypoint = "./functions/convidar-usuario/index.ts"

[functions.gerenciar-usuario]
enabled = true
verify_jwt = false
entrypoint = "./functions/gerenciar-usuario/index.ts"
