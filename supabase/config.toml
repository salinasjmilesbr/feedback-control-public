# Inicializado por supabase init (CLI 2.116.0), reduzido ao escopo local F1-01.
# Referência: https://supabase.com/docs/guides/local-development/cli/config
project_id = "feedback-control"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Seed sintético de desenvolvimento (F1-05), reaplicado a cada db reset/rebuild.
# Sem dados funcionais: o schema técnico ainda não possui tabelas de domínio.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Auth local habilitado a partir da F2-01 (Issue #68): fornece o schema auth e
# a tabela auth.users, fonte de identidade para o perfil interno (user_profiles)
# e para RLS. A F2-03 (Issue #70) desabilita o auto-cadastro público: contas são
# criadas apenas por fluxos administrativos futuros (F2-06); o login usa e-mail
# e senha via Supabase Auth.
[auth]
enabled = true
enable_signup = false

[auth.email]
enable_signup = false

[realtime]
enabled = false

[storage]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
