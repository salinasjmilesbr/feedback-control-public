# Inicializado por supabase init (CLI 2.116.0), reduzido ao escopo local F1-01.
# Referência: https://supabase.com/docs/guides/local-development/cli/config
project_id = "feedback-control"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Seed sintético de desenvolvimento (F1-05), reaplicado a cada db reset/rebuild.
# Sem dados funcionais: o schema técnico ainda não possui tabelas de domínio.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Serviços fora do escopo F1-01 permanecem desabilitados.
[auth]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
