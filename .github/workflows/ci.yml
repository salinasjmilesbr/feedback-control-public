name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Test, build, lint and diff-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A clean checkout has no working-tree diff; check the event's changes.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            # A newly created main has no previous commit to compare against.
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA=$(git hash-object -t tree /dev/null)
            fi
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

  supabase-local:
    name: Supabase local — RLS/policy validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Apenas o banco local (roles.sql + auth.uid() + migrations). Sem rede
      # remota: tudo em containers efêmeros do runner (docker).
      - name: Start local Supabase database
        run: npx --yes supabase@2.116.0 db start --yes

      - name: Apply migrations (db reset)
        run: npx --yes supabase@2.116.0 db reset --local --yes

      - name: Seed F4-08 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/01-cenario-f4-08.sql

      - name: Run F4-08 validation (RLS + schema guard)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/02-validar-f4-08.sql

      - name: Run F4-08 schema-guard mutation tests
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/03-validar-f4-08-mutacoes.sql

      - name: Seed F5-04 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/01-cenario-f5-04.sql

      - name: Run F5-04 validation (access roles/capabilities — D14–D18)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/02-validar-f5-04.sql
