name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Test, build, lint and diff-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A clean checkout has no working-tree diff; check the event's changes.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            # A newly created main has no previous commit to compare against.
            if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA=$(git hash-object -t tree /dev/null)
            fi
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

  supabase-local:
    name: Supabase local — RLS/policy validation
    runs-on: ubuntu-latest
    # Cenarios/validadores SQL: F4-08, F5-04, F5-08 P6, F5-09 P1 e regressao F5-06/F5-07.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Apenas o banco local (roles.sql + auth.uid() + migrations). Sem rede
      # remota: tudo em containers efêmeros do runner (docker).
      - name: Start local Supabase database
        run: npx --yes supabase@2.116.0 db start --yes

      - name: Apply migrations (db reset)
        run: npx --yes supabase@2.116.0 db reset --local --yes

      - name: Seed F4-08 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/01-cenario-f4-08.sql

      - name: Run F4-08 validation (RLS + schema guard)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/02-validar-f4-08.sql

      - name: Run F4-08 schema-guard mutation tests
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/03-validar-f4-08-mutacoes.sql

      - name: Seed F5-04 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/01-cenario-f5-04.sql

      - name: Run F5-04 validation (access roles/capabilities — D14–D18)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/02-validar-f5-04.sql

      # ----------------------------------------------------------------------
      # F5-08 (P6): os três validadores da atividade corrente. Rodam ANTES dos
      # validadores de regressão para que uma falha da F5-08 não seja mascarada
      # por outra atividade.
      # ----------------------------------------------------------------------
      - name: Seed F5-08 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/01-cenario-f5-08.sql

      - name: Run F5-08 validation (integridade estrutural + 15 RPCs)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/02-validar-f5-08.sql

      - name: Run F5-08 cutover validation (P6 — PostgreSQL como única autoridade)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/03-validar-f5-08-cutover.sql

      # ----------------------------------------------------------------------
      # F5-09 (P1): fundacao soberana de ciclos (schema/trilha/grants). Roda
      # antes dos validadores de regressao para que uma falha da F5-09 nao seja
      # mascarada por outra atividade.
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P1 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/01-cenario-f5-09.sql

      - name: Run F5-09 P1 validation (integridade de ciclos + trilha append-only)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/02-validar-f5-09.sql

      # ----------------------------------------------------------------------
      # F5-09 (P2): RPCs soberanas de gestao de ciclo (criar/editar/ativar/
      # encerrar). Mesma organizacao sintetica propria (prefixo e9); exige a P1
      # aplicada e a fixture insert-once do cenario 03.
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P2 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/03-cenario-f5-09-p2.sql

      - name: Run F5-09 P2 validation (RPCs de gestao de ciclo soberanas)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/04-validar-f5-09-p2.sql

      # ----------------------------------------------------------------------
      # F5-09 (P3): inclusao aditiva soberana de nova admissao em ciclo ATIVO
      # (D26 §7.2/§7.3). Fixture ISOLADA propria (prefixo ea) — nao depende do
      # estado mutado pelos validadores da P2 — e roda ANTES das regressoes.
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P3 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/05-cenario-f5-09-p3.sql

      - name: Run F5-09 P3 validation (inclusao aditiva de nova admissao)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/06-validar-f5-09-p3.sql

      # ----------------------------------------------------------------------
      # F5-09 (P4): transicoes excepcionais soberanas (cancelar/reabrir/corrigir
      # periodo). Fixture ISOLADA propria (prefixo eb) e roda ANTES das
      # regressoes.
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P4 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/07-cenario-f5-09-p4.sql

      - name: Run F5-09 P4 validation (cancelar, reabrir e corrigir periodo)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/08-validar-f5-09-p4.sql

      # ----------------------------------------------------------------------
      # F5-09 (P5): leitura SOBERANA de ciclos por RLS own-tenant (SELECT para
      # `authenticated` + grant minimo). Fixture ISOLADA propria (prefixo ec);
      # a fase e somente de leitura — nenhuma RPC/capability nova entra aqui.
      # Roda ANTES das regressoes F5-06/F5-07.
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P5 scenario
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/09-cenario-f5-09-p5.sql

      - name: Run F5-09 P5 validation (RLS own-tenant de leitura de ciclos)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/10-validar-f5-09-p5.sql

      # ----------------------------------------------------------------------
      # F5-09 (P7): reconciliacao ADITIVA do catalogo (D28 — `cycle.manage` no
      # bundle `admin`; as tres excepcionais ficam fora dos bundles DE SISTEMA e
      # seguem concediveis em roles CUSTOMIZADAS) + integridade herdada de
      # P5/P6. Nao exige cenario proprio (valida o estado do catalogo/bundle).
      # ----------------------------------------------------------------------
      - name: Run F5-09 P7 validation (D28 no bundle admin + regressoes P5/P6)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/11-validar-f5-09-p7.sql

      # ----------------------------------------------------------------------
      # F5-09 (P7) D28 — GUARDAS POR TIPO DE ROLE e IDEMPOTENCIA da migration:
      # o cenario cria role CUSTOMIZADA (nao-sistema) com as tres capabilities
      # excepcionais e prepara o estado "primeira execucao"; a migration e
      # REAPLICADA duas vezes (adiciona exatamente 1 e depois nao duplica) e o
      # validador 13 confere A-H. Fail-closed: qualquer guarda que dispare
      # derruba o passo (ON_ERROR_STOP).
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P7 D28 scenario (role customizada + estado de idempotencia)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/12-cenario-f5-09-p7-d28.sql

      - name: F5-09 P7 D28 — reaplica a migration duas vezes (idempotencia)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20260921000000_f5_09_p7_catalog_admin_bundle.sql
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20260921000000_f5_09_p7_catalog_admin_bundle.sql

      - name: Run F5-09 P7 D28 validation (guardas por tipo de role + idempotencia)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/13-validar-f5-09-p7-d28.sql

      # ----------------------------------------------------------------------
      # F5-09 (P9) — VALIDACAO INTEGRADA (Issue da P9): matriz dos 11 blocos
      # obrigatorios sobre o contrato real das P1-P8. Os validadores da atividade
      # corrente rodam ANTES das regressoes F5-06/F5-07, como nas fases
      # anteriores. O bloco 6 (CONCORRENCIA REAL) roda em DUAS SESSAOES psql
      # distintas: a sessao A em background segura `ciclo_lock_organizacao`
      # (`evaluation_cycles:<org>`) enquanto a sessao B tenta a MESMA edicao com
      # o MESMO `expected_version` — B so pode terminar em CONFLICT depois de
      # esperar o lock, o que e evidencia de contencao server-side (diferente da
      # concorrencia client-side coberta na P8).
      # ----------------------------------------------------------------------
      - name: Seed F5-09 P9 scenario (fixture integrada, prefixo `ed`)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/14-cenario-f5-09-p9.sql

      - name: Run F5-09 P9 integrated validation (cross-tenant, membership, capability, IDOR, stale, idempotencia, rollback, auditoria, RLS)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/15-validar-f5-09-p9.sql

      - name: "Run F5-09 P9 concurrency (DUAS sessoes reais: A em background, B em foreground)"
        run: |
          set -e
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/16-sessao-a-f5-09-p9-concorrencia.sql &
          SESSAO_A=$!
          # A sessao B NAO depende de tempo fixo: o laco dela aguarda o ciclo E a
          # MARCA de contencao publicada por A DENTRO do UPDATE (ja com o lock da
          # organizacao em maos). O `sleep 1` existe apenas para dar tempo ao
          # start do processo de A; a janela real e o pg_sleep(8) de A, com o
          # limiar de contencao de 2s exigido por B.
          sleep 1
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/17-sessao-b-f5-09-p9-concorrencia.sql
          wait "$SESSAO_A"

      - name: Run F5-09 P9 concurrency consolidation (estado final apos a corrida)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/18-validar-f5-09-p9-concorrencia.sql

      # ----------------------------------------------------------------------
      # F5-10 (P1) — SCHEMA/INTEGRIDADE/LIMITES das metas soberanas (Issue #210):
      # fixture isolada (`ee`) + validador com testes NEGATIVOS obrigatorios
      # (FKs compostas cross-tenant, dominio de progresso/tipo/status/fechamento,
      # quota soberana, unicidade parcial, soft delete sem DELETE fisico, trilha
      # append-only e RLS — pos-F5-10 P4, goals/approvals sao LEGIVEIS own-tenant e
      # events/limits seguem deny-by-default). Roda depois das fases F5-09 e ANTES
      # das regressoes, como as demais atividades correntes.
      # ----------------------------------------------------------------------
      - name: "Seed F5-10 P1 scenario (metas: schema/integridade/limites)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/19-cenario-f5-10-p1.sql

      - name: Run F5-10 P1 validation (schema, integridade, limites e RLS de metas)
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/20-validar-f5-10-p1.sql

      # ----------------------------------------------------------------------
      # F5-10 (P2) — OPERACOES SOBERANAS de metas (Issue #212): fixture isolada
      # (prefixo `f0`) + validador com positivos e NEGATIVOS obrigatorios (UUID
      # canonico, tenant revalidado, expected_version, idempotencia por
      # operation_id, eventos append-only, autoria resolvida no banco, lock
      # normativo unico, quota do banco, atomicidade/rollback e zero DELETE
      # fisico). Roda depois da P1 e ANTES das regressoes.
      # ----------------------------------------------------------------------
      - name: "Seed F5-10 P2 scenario (operacoes soberanas de metas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/21-cenario-f5-10-p2.sql

      - name: "Run F5-10 P2 validation (criar/editar/progresso/finalizar/revisar/excluir)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/22-validar-f5-10-p2.sql

      # ----------------------------------------------------------------------
      # F5-10 (P3) — APROVACOES e INVALIDACAO de metas (Issue #214): fixture
      # isolada (prefixo `f1`) com o SNAPSHOT CONGELADO de participantes
      # (F5-06) + validador com positivos e NEGATIVOS obrigatorios (derivacao
      # GERENTE/COORDENADOR da estrutura congelada, fail-closed, matriz D19
      # conectada a edicao material, idempotencia, rollback e ACL). Roda depois
      # da P2 e ANTES das regressoes.
      # ----------------------------------------------------------------------
      - name: "Seed F5-10 P3 scenario (aprovacoes e invalidacao de metas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/23-cenario-f5-10-p3.sql

      - name: "Run F5-10 P3 validation (aprovar/invalidar + matriz D19)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/24-validar-f5-10-p3.sql

      # ----------------------------------------------------------------------
      # F5-10 (P4) — AUTORIZACAO/RLS DE METAS (Issue #216): fixture isolada
      # (prefixo `f2`) + validador com positivos e NEGATIVOS obrigatorios
      # (gate funcional goal.read + relacao SELF/aprovador congelado na leitura
      # por escopo, RLS own-tenant de evaluation_goals/evaluation_goal_approvals
      # com a policy ANTES do grant, events/limits deny-by-default, ausencia de
      # escrita de cliente e de capability/bundle novo). Roda depois da P3 e
      # ANTES das regressoes.
      # ----------------------------------------------------------------------
      - name: "Seed F5-10 P4 scenario (autorizacao e RLS de metas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/25-cenario-f5-10-p4.sql

      - name: "Run F5-10 P4 validation (goal.read + RLS own-tenant de metas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/26-validar-f5-10-p4.sql

      # ----------------------------------------------------------------------
      # F5-10 P5.2 (Issue #222): projecao soberana de leitura de metas.
      # Roda logo APOS o P4 (depende da fixture deixada pelos cenarios 25/26) e
      # ANTES das regressoes F5-06/F5-07.
      # ----------------------------------------------------------------------
      - name: "Run F5-10 P5.2 validation (projecao soberana de leitura de metas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/28-validar-f5-10-p5-2.sql

      # ----------------------------------------------------------------------
      # F5-10 P7 (Issue #232) — VALIDACAO INTEGRADA do dominio de metas.
      # Fixture integrada (prefixo `e8`; 3 organizacoes: Alfa = matriz, Beta =
      # cross-tenant, Gama = corrida EXCLUSIVA) + matriz dos blocos 1 e 4-19.
      # O BLOCO 6 (CONCORRENCIA REAL) roda em DUAS SESSOES psql distintas: a
      # sessao A em background segura `ciclo_lock_organizacao`
      # (`evaluation_cycles:<org>`) dentro de uma escrita atrasada em ~8s,
      # enquanto a sessao B tenta a MESMA edicao (mesma versao) e a MESMA
      # aprovacao (mesmo papel) — B so pode terminar em CONFLICT DEPOIS de
      # esperar o lock, o que e evidencia de contencao server-side. Roda ANTES
      # das regressoes F5-06/F5-07, como as demais atividades correntes.
      # ----------------------------------------------------------------------
      - name: "Seed F5-10 P7 scenario (validacao integrada de metas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/29-cenario-f5-10-p7.sql

      - name: "Run F5-10 P7 integrated validation (sequencia historica, cross-tenant, membership, capability, IDOR, ciclo, quota, idempotencia, rollback, append-only, RLS, guardas invertidas)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/30-validar-f5-10-p7.sql

      - name: "Run F5-10 P7 concurrency (DUAS sessoes reais: A em background, B em foreground)"
        run: |
          set -e
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/31-sessao-a-f5-10-p7-concorrencia.sql &
          SESSAO_A=$!
          # A sessao B NAO depende de tempo fixo: o laco dela aguarda o alvo E a
          # MARCA de contencao publicada por A DENTRO da escrita (ja com o lock da
          # organizacao em maos). O `sleep 1` existe apenas para dar tempo ao start
          # do processo de A; a janela real e o pg_sleep(8) de A, com o limiar de
          # contencao de 2s exigido por B.
          sleep 1
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/32-sessao-b-f5-10-p7-concorrencia.sql
          wait "$SESSAO_A"

      - name: "Run F5-10 P7 concurrency consolidation (estado final apos as duas corridas + higiene)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/33-validar-f5-10-p7-concorrencia.sql

      # ----------------------------------------------------------------------
      # F5-11 P1 (Issue #238): schema + trilha append-only das OBSERVAÇÕES e
      # substituição dos guards invertidos (a proibição absoluta de objeto de
      # observação virou LISTA FECHADA). As fases correntes rodam ANTES das
      # regressões abaixo, para não serem mascaradas.
      # ----------------------------------------------------------------------
      - name: "Seed F5-11 P1 scenario (observacoes: schema/trilha)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/34-cenario-f5-11-p1.sql

      - name: "Run F5-11 P1 validation (schema, CHECKs, FKs compostas, imutabilidade D4, trilha append-only D6, RLS D9 e D15 intacto)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/35-validar-f5-11-p1.sql

      # ----------------------------------------------------------------------
      # F5-11 P1.1 (Issue #242): correção do finding MEDIUM do Codex — coerência
      # ESTRUTURAL perfil↔membership (e author_collaborator_id) NA MESMA
      # organização. Fixture própria (prefixo `fe`), sem tocar em 34/35.
      # ----------------------------------------------------------------------
      - name: "Seed F5-11 P1.1 scenario (coerencia perfil<->membership intra-tenant)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/36-cenario-f5-11-p1-1.sql

      - name: "Run F5-11 P1.1 validation (negative/positive dos 4 pares perfil<->membership + author_collaborator_id)"
        run: |
          docker exec -i supabase_db_feedback-control \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/validacao/37-validar-f5-11-p1-1.sql

      # ----------------------------------------------------------------------
      # F5-11 P2 (Issue #244): RPCs soberanas `observacao_*`. A fixture usa o
      # prefixo `f5b2`; o validador exercita o caminho ALLOW com uma concessão
      # TRANSITÓRIA (begin/rollback) e prova o DENY de produção sem concessão.
      # ----------------------------------------------------------------------
      - name: "Seed F5-11 P2 scenario (observacoes: RPCs soberanas)"
        run: |
          docker exec -i supabase_db_feedback-control \
